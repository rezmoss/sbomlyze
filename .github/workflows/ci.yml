name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: |
          go test -mod=mod -v -race -coverprofile=coverage.out ./...
          node --test action/test/*.test.js


  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
          args: --timeout=5m
          install-mode: goinstall

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, vulnerability-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify build
        run: go build -v ./...

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.123.8'
          extended: true

      # same build as the release deploy, from this commit; the examples'
      # fact checks run on this commit's binary (no rescans, no publish)
      - name: Build site
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          SHA=$(git rev-list -n1 "$TAG" 2>/dev/null || echo "$GITHUB_SHA")
          scripts/site-build.sh . "$TAG" "$SHA" 0 "$RUNNER_TEMP/public"

  website-release-notes:
    name: Website impact
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Comment site changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          LAST=$(git describe --tags --abbrev=0)
          gen() { mkdir -p "$2/data/gen" "$2/content"; (cd "$1" && go run ./internal/tools/sitegen -repo . -site "$2" -tag x -sha x) >/dev/null; }
          gen . "$RUNNER_TEMP/head"
          {
            echo "### Website impact"
            echo
            echo "When this release succeeds, sbomlyze.com is rebuilt from the new tag."
            echo
            if git cat-file -e "$LAST:internal/tools/sitegen/main.go" 2>/dev/null; then
              git worktree add -q "$RUNNER_TEMP/base" "$LAST"
              gen "$RUNNER_TEMP/base" "$RUNNER_TEMP/basesite"
              changed=""
              for f in action cli policy sarif compliance versions; do
                cmp -s "$RUNNER_TEMP/basesite/data/gen/$f.json" "$RUNNER_TEMP/head/data/gen/$f.json" || changed="$changed $f"
              done
              echo "Generated reference sections that change since $LAST:${changed:- none}"
            else
              echo "$LAST predates the site generator; every reference section is regenerated."
            fi
            if git diff "$LAST" -- CHANGELOG.md | grep -q '^+### Features'; then
              echo
              echo "This release has **features**. Hand-written pages are not generated; review them before merging:"
              echo "\`site/layouts/index.html\`, \`site/layouts/_default/drift.html\`, \`site/data/home.yaml\`, \`site/data/drift.yaml\`."
            fi
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --edit-last --body-file "$RUNNER_TEMP/comment.md" 2>/dev/null \
            || gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
