name: Website

# Publishes sbomlyze.com. Reference data (Action, CLI, policy, SARIF,
# compliance, version rules, changelog, JSON contract, example report) is
# generated from the release tag; pages and wording come from main.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        type: string
        required: true
      deploy:
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'showcase/**'
      - 'testdata/showcase/**'
      - 'internal/tools/showcase/**'
      - 'scripts/site-build.sh'
      - 'scripts/showcase-media.sh'
      - 'scripts/webui-shot.mjs'
      - '.github/workflows/site.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: latest release)'
        required: false
        type: string
      deploy:
        description: Deploy to gh-pages (off = build and upload a preview artifact)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName --jq .tagName)
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid tag: $TAG" >&2
            exit 1
          fi
          git fetch --tags --quiet
          SHA=$(git rev-list -n1 "$TAG")
          STARS=$(gh api "repos/$GH_REPO" --jq .stargazers_count || echo 0)
          {
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "stars=$STARS"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG ($SHA), $STARS stars"

      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.rel.outputs.tag }}
          path: release-src
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: release-src/go.mod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.123.8'
          extended: true

      # previous release's example outputs and archived tags
      - name: Checkout published examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: published
          sparse-checkout: examples
          persist-credentials: false

      - name: Install recording tools
        env:
          VHS_VERSION: 0.10.0
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg ttyd
          go install "github.com/charmbracelet/vhs@v$VHS_VERSION"
          echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Build site
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          SHA: ${{ steps.rel.outputs.sha }}
          STARS: ${{ steps.rel.outputs.stars }}
          SHOWCASE_MEDIA: '1'
        run: |
          SHOWCASE_PREV="$GITHUB_WORKSPACE/published/examples"
          SHOWCASE_ARCHIVES=$(find "$SHOWCASE_PREV" -mindepth 1 -maxdepth 1 -type d -name 'v*' -printf '%f,' 2>/dev/null || true)
          export SHOWCASE_PREV SHOWCASE_ARCHIVES
          scripts/site-build.sh release-src "$TAG" "$SHA" "$STARS" "$GITHUB_WORKSPACE/public"

      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-${{ steps.rel.outputs.tag }}
          path: public
          retention-days: 7

  deploy:
    name: Deploy to gh-pages
    needs: build
    if: inputs.deploy != false
    runs-on: ubuntu-latest
    # one gh-pages push at a time
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-${{ needs.build.outputs.tag }}
          path: public

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages

      - name: Sync site into gh-pages (preserve package repositories)
        run: |
          cd gh-pages
          # keep examples/vX.Y.Z/ archives of earlier releases
          keep="$RUNNER_TEMP/archives"
          mkdir -p "$keep"
          # a failed move stops the step before anything is deleted
          for d in examples/v*/; do
            [ -d "$d" ] && mv "$d" "$keep/"
          done
          # keep apk/ deb/ rpm/ package repos and the vendor/ mirror
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.nojekyll' \
            ! -name 'apk' \
            ! -name 'deb' \
            ! -name 'rpm' \
            ! -name 'vendor' \
            -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/public/." .
          # a published archive is never rewritten
          mkdir -p examples
          for d in "$keep"/v*; do
            [ -d "$d" ] || continue
            rm -rf "examples/$(basename "$d")"
            mv "$d" examples/
          done
          touch .nojekyll

      - name: Commit and push
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Deploy website for $TAG from ${GITHUB_SHA::7}"
          git push

  verify:
    name: Verify live site
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for sbomlyze.com to serve the release
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # Pages build + CDN can take minutes
          for i in $(seq 1 40); do
            if curl -fsSL "https://sbomlyze.com/?v=$RANDOM$i" | grep -q "name=sbomlyze-version content=\"$TAG\"\|name=\"sbomlyze-version\" content=\"$TAG\""; then
              echo "sbomlyze.com serves $TAG"
              exit 0
            fi
            sleep 30
          done
          echo "sbomlyze.com still not serving $TAG after 20 minutes" >&2
          exit 1
