options:
  - k: "-i, --interactive"
    d: "Interactive TUI explorer"
  - k: "-web, --web"
    d: "Start the web UI server"
  - k: "--port <port>"
    d: "Web server port (default 8080)"
  - k: "--json"
    d: "Shorthand for --format json"
  - k: "--format <format>"
    d: "text, json, sarif, junit, markdown, html, patch"
  - k: "--compliance"
    d: "Show NTIA / CISA / BSI compliance scoring"
  - k: "--policy <file>"
    d: "Policy file for CI checks"
  - k: "--strict"
    d: "Fail on parse warnings"
  - k: "--tolerant"
    d: "Continue on parse warnings (default)"
  - k: "--no-pager"
    d: "Disable automatic paging of output"
  - k: "--to <format>"
    d: "Target format for convert: cyclonedx (cdx), spdx, syft"
  - k: "-o, --output <file>"
    d: "Output file for convert (default stdout)"
  - k: "--version, -v"
    d: "Show version information"
  - k: "--help, -h"
    d: "Show the help message"

outFormats:
  - name: "text"
    f: "--format text (default)"
    d: "Human-readable terminal output"
    b: "Local inspection"
  - name: "json"
    f: "--json"
    d: "Structured JSON"
    b: "CI pipelines, scripting"
  - name: "sarif"
    f: "--format sarif"
    d: "SARIF 2.1.0 with integrity-drift, deep-dependency, new/removed-component, version-change, and policy-violation rules"
    b: "GitHub Code Scanning"
  - name: "junit"
    f: "--format junit"
    d: "JUnit XML test cases for drift, depth, and each policy violation"
    b: "CI test dashboards"
  - name: "markdown"
    f: "--format markdown"
    d: "Side-by-side comparison table, key findings, and collapsible package sections"
    b: "Pull request comments"
  - name: "html"
    f: "--format html"
    d: "Single self-contained file with inline CSS and JS, no external assets"
    b: "Auditors, sharable reports"
  - name: "patch"
    f: "--format patch"
    d: "RFC 6902 JSON Patch operations representing the diff"
    b: "Programmatic patching"

rules:
  - k: "max_added"
    d: "Maximum new components allowed (0 = unlimited)"
  - k: "max_removed"
    d: "Maximum removed components allowed"
  - k: "max_changed"
    d: "Maximum changed components allowed"
  - k: "deny_licenses"
    d: "Forbidden licence identifiers"
  - k: "require_licenses"
    d: "Require all added components to have licences"
  - k: "deny_duplicates"
    d: "Fail if duplicate packages exist in the result"
  - k: "deny_integrity_drift"
    d: "Fail if a hash changed without a version change"
  - k: "max_depth"
    d: "Fail if new transitive dependencies reach depth ≥ N"
  - k: "warn_supplier_change"
    d: "Warn, not fail, if a supplier or author changed"
  - k: "warn_new_transitive"
    d: "Warn on any new transitive dependencies"
  - k: "min_ntia_score"
    d: "Fail below this NTIA score (0–100)"
  - k: "min_cisa_score"
    d: "Fail below this CISA score (0–100)"
  - k: "min_bsi_score"
    d: "Fail below this BSI score (0–100)"
  - k: "min_overall_compliance"
    d: "Fail below this overall score (0–100)"

identity:
  - p: "1"
    name: "PURL"
    e: "pkg:npm/lodash"
  - p: "2"
    name: "CPE"
    e: "cpe:vendor:product"
  - p: "3"
    name: "BOM-ref / SPDXID"
    e: "ref:component-123"
  - p: "4"
    name: "Namespace + name"
    e: "com.example/mypackage"
  - p: "5"
    name: "Name"
    e: "simple-package"

sbomFormats:
  - name: "Syft (native)"
    d: '"artifacts" + one of "source", "distro", "descriptor"'
  - name: "CycloneDX"
    d: '"bomFormat": "CycloneDX", or a cyclonedx $schema'
  - name: "SPDX"
    d: '"spdxVersion" starting with "SPDX-"'
