identity:
  - p: "1"
    name: "PURL"
    e: "pkg:npm/lodash"
  - p: "2"
    name: "CPE"
    e: "cpe:vendor:product"
  - p: "3"
    name: "BOM-ref / SPDXID"
    e: "ref:component-123"
  - p: "4"
    name: "Namespace + name"
    e: "com.example/mypackage"
  - p: "5"
    name: "Name"
    e: "simple-package"

sbomFormats:
  - name: "Syft (native)"
    d: '"artifacts" + one of "source", "distro", "descriptor"'
  - name: "CycloneDX"
    d: '"bomFormat": "CycloneDX", or a cyclonedx $schema'
  - name: "SPDX"
    d: '"spdxVersion" starting with "SPDX-"'
