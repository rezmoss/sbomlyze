layers:
  - layer: "Manifest or lockfile diff"
    q: "What dependency resolution did the developer request or record?"
    s: "Direct and resolved version changes"
    b: "Does not prove what entered the built artifact"
  - layer: "Ordinary SBOM component diff"
    q: "What components does each build report?"
    s: "Added, removed, and version-changed components"
    b: "A same-name, same-version replacement can look unchanged"
  - layer: "Integrity drift"
    q: "Did a package's recorded digest change without its version changing?"
    s: "Same-version package digest change (same kind: SHA-256, go-h1, …)"
    b: "Only as good as digest coverage; many images carry no package digest"
  - layer: "Owned-file drift"
    q: "Did files a package owns change without its version changing?"
    s: "Modified, added or removed owned files, from the SBOM's file inventory"
    b: "Needs Syft JSON or SPDX file data; files the generator did not hash are invisible"

explanations:
  - "A package or artifact was replaced without a version bump."
  - "A dependency mirror or registry served different content."
  - "The build is not reproducible and embeds timestamps or environment data."
  - "The SBOM generator changed what bytes it hashes."
  - "Platform, architecture, or build flags changed between the baseline and head."
  - "The trusted baseline was generated from a different stage of the build."
  - "A package was rebuilt with the same version (e.g. the same Alpine -rN)."
  - "A file was edited after install: a config change, or tampering."

trust:
  - num: "01"
    d: "Generate baseline and head SBOMs at the same lifecycle stage."
  - num: "02"
    d: "Pin the generator and its configuration."
  - num: "03"
    d: "Keep operating system, architecture, and build flags comparable."
  - num: "04"
    d: "Prefer cryptographic component hashes emitted by the generator; do not synthesise them from names and versions."
  - num: "05"
    d: "Investigate one expected rebuild to identify legitimate nondeterminism."
  - num: "06"
    d: "Update the baseline only after the change has been reviewed and accepted."
  - num: "07"
    d: "Read digest_coverage and file_coverage: a clean result over few comparable pairs says little."
