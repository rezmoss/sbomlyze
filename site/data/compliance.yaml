frameworks:
  - standard: "NTIA"
    year: "2021"
    name: "NTIA Minimum Elements"
    req: "Name, version, supplier, unique identifiers (PURL/CPE), dependency relationships, SBOM author, and timestamp."
  - standard: "CISA"
    year: "Aug 2025 draft"
    name: "CISA 2025 Minimum Elements"
    req: "Adds software producer, licence information, component hash, and tool name on top of NTIA."
  - standard: "BSI-TR-03183"
    year: "v2.1.0, 2025"
    name: "BSI TR-03183-2"
    req: "Requires component creator contact, SHA-512 hash, SPDX-format licences, and SBOM creator contact."
