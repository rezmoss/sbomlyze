inputs:
  - k: "sbom-path"
    r: "yes"
    v: "—"
    m: "Repository-relative head SBOM path."
  - k: "base-sbom-path"
    r: "no"
    v: "sbom-path"
    m: "Different repository-relative path at the baseline revision."
  - k: "baseline"
    r: "no"
    v: "git"
    m: "git, release, workflow-artifact, url, or file."
  - k: "baseline-repository"
    r: "no"
    v: "current repo"
    m: "OWNER/REPO for release or artifact lookup."
  - k: "baseline-asset"
    r: "for release"
    v: "—"
    m: "Exact asset name in the latest non-draft, non-prerelease release."
  - k: "baseline-artifact"
    r: "for artifact"
    v: "—"
    m: "Exact artifact name from the newest successful default-branch run containing it."
  - k: "baseline-artifact-path"
    r: "no"
    v: "base-sbom-path"
    m: "Exact SBOM path inside the artifact ZIP."
  - k: "baseline-url"
    r: "for url"
    v: "—"
    m: "Public HTTPS URL; credentials and the GitHub token are never forwarded."
  - k: "baseline-path"
    r: "no"
    v: "base-sbom-path"
    m: "Repository-relative workspace file used by baseline: file."
  - k: "policy"
    r: "no"
    v: "—"
    m: "Repository-relative SBOMlyze JSON policy."
  - k: "comment"
    r: "no"
    v: "false"
    m: "Create or update one pull-request comment."
  - k: "github-token"
    r: "no"
    v: "github.token"
    m: "Token used for provenance, comments, release assets, and workflow artifacts."
  - k: "sarif"
    r: "no"
    v: "false"
    m: "Generate report-sarif."
  - k: "fail-on"
    r: "no"
    v: "policy"
    m: "policy, integrity-drift, any-change, or never."
  - k: "version"
    r: "no"
    v: "v0.5.3"
    m: "Exact binary release; floating values such as latest are rejected."

baselines:
  - k: "baseline: git"
    t: "Pull-request base"
    d: "The default. Reads base-sbom-path directly from the pull request base SHA without checking out or executing base-branch code. Use fetch-depth: 0."
  - k: "baseline: release"
    t: "Latest GitHub release"
    d: "Excludes drafts and prereleases. No release is treated as a visible first run; a latest release missing the exact asset name fails as a configuration error."
  - k: "baseline: workflow-artifact"
    t: "Default-branch artifact"
    d: "Newest successful default-branch run, pull-request runs excluded, expired artifacts ignored, and only the exact requested file extracted. Unsafe ZIP entries fail closed."
  - k: "baseline: url"
    t: "Explicit HTTPS URL"
    d: "Rejects HTTP, credentials, non-default ports, private addresses, unsafe redirects, and responses above 50 MiB."
  - k: "baseline: file"
    t: "Local workspace file"
    d: "A file produced or downloaded by an earlier reviewed step, with the same traversal, symlink-escape, and size checks."

outputs:
  - k: "verdict"
    d: "pass or fail."
  - k: "added-count · removed-count · changed-count"
    d: "Decimal string counts from the diff."
  - k: "integrity-drift-count"
    d: "Components whose hash changed without a version change."
  - k: "report-json · report-markdown · report-sarif"
    d: "Absolute runner paths, so later steps upload full reports without hitting workflow-output size limits. report-sarif is empty unless sarif: true."

security:
  - "SBOM, policy, and baseline paths must stay inside the repository; absolute paths, traversal, symlink escape, and unsafe archive entries are rejected."
  - "Head, baseline, and policy files are limited to 50 MiB, with separate bounded limits on output, downloads, comments, and summaries."
  - "The release archive and checksums.txt are downloaded only over HTTPS from GitHub release hosts. SHA-256 is mandatory before extraction."
  - "When gh attestation verify is available, provenance from the release workflow is mandatory; without gh, the Action warns after checksum verification."
  - "Inputs are passed to git, tar, gh, and SBOMlyze as process argument arrays. No input is interpolated into a shell command."
  - "Git baselines are read with git cat-file and git show; the Action never checks out baseline code."
  - "GitHub tokens are sent only to api.github.com and are removed on redirects. URL baselines never receive the token."
  - "Parsing uses strict mode. Malformed and oversized inputs fail closed."
