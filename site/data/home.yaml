features:
  - num: "01"
    t: "Drift classification"
    d: "Version, integrity, metadata and owned-file drift are separated, and scanner file entries (go.mod, workflows) are reported apart from packages."
  - num: "02"
    t: "Dependency graph diff"
    d: "Added and removed edges, new transitive reachability, the exact path to each new dependency, and its depth."
  - num: "03"
    t: "Depth risk summary"
    d: "Depth 1 is a choice you made. Depth 3+ is flagged for careful review."
  - num: "04"
    t: "Occurrence matching"
    d: "Each package is matched by identity, version and location, so a package in two lockfiles is never dropped or paired across lockfiles, and results do not depend on input order."
  - num: "05"
    t: "Compliance scoring"
    d: "NTIA, CISA 2025, and BSI TR-03183 minimum elements with per-check pass/fail detail."
  - num: "06"
    t: "Duplicate & collision detection"
    d: "Multiple versions of one package, name mismatches, and same-version hash conflicts."
  - num: "07"
    t: "Format conversion"
    d: "Any input format to CycloneDX 1.5, SPDX 2.3, or Syft JSON, preserving PURLs, hashes, and relationships."
  - num: "08"
    t: "Statistics mode"
    d: "One document in, auto-detected key findings out: ecosystem dominance, licence profile, coverage warnings."
  - num: "09"
    t: "Tolerant parsing"
    d: "Continue on malformed input with structured warnings, or use --strict to fail closed."
  - num: "10"
    t: "Ecosystem-correct versions"
    d: "Upgrade, downgrade and major/minor/patch/revision follow each ecosystem's own rules, checked against dpkg, rpm, apk, pacman, RubyGems and Maven."
  - num: "11"
    t: "Owned-file drift"
    d: "From Syft JSON and SPDX file inventories: a package that keeps its version while files it owns are modified, added or removed."
  - num: "12"
    t: "Digest coverage"
    d: "Reports how many same-version packages could actually be checked, by digest kind (go-h1, SHA-256, cargo-checksum), so a clean result is not mistaken for proof."
