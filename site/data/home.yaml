matrix:
  - cap: "SBOM-to-SBOM diff"
    a: "yes"
    b: "basic"
    c: "—"
    d: "—"
  - cap: "Integrity / tamper drift (hash changed without version)"
    a: "yes"
    b: "—"
    c: "—"
    d: "—"
  - cap: "Dependency-graph diff + transitive depth risk"
    a: "yes"
    b: "—"
    c: "—"
    d: "—"
  - cap: "NTIA / CISA / BSI compliance scoring"
    a: "yes"
    b: "—"
    c: "yes"
    d: "—"
  - cap: "Format conversion (Syft / CycloneDX / SPDX)"
    a: "yes"
    b: "yes"
    c: "—"
    d: "partial"
  - cap: "TUI + Web UI explorers"
    a: "yes"
    b: "—"
    c: "—"
    d: "—"
  - cap: "Policy gate + SARIF / JUnit / Markdown / HTML / Patch"
    a: "yes"
    b: "partial"
    c: "partial"
    d: "partial"

features:
  - num: "01"
    t: "Drift classification"
    d: "Version drift, integrity drift, and metadata drift are separated, not merged into one changed count."
  - num: "02"
    t: "Dependency graph diff"
    d: "Added and removed edges, new transitive reachability, the exact path to each new dependency, and its depth."
  - num: "03"
    t: "Depth risk summary"
    d: "Depth 1 is a choice you made. Depth 3+ is flagged for careful review."
  - num: "04"
    t: "Strong identity matching"
    d: "PURL → CPE → BOM-ref → namespace/name precedence, so cross-format diffs stay meaningful."
  - num: "05"
    t: "Compliance scoring"
    d: "NTIA, CISA 2025, and BSI TR-03183 minimum elements with per-check pass/fail detail."
  - num: "06"
    t: "Duplicate & collision detection"
    d: "Multiple versions of one package, name mismatches, and same-version hash conflicts."
  - num: "07"
    t: "Format conversion"
    d: "Any input format to CycloneDX 1.5, SPDX 2.3, or Syft JSON, preserving PURLs, hashes, and relationships."
  - num: "08"
    t: "Statistics mode"
    d: "One document in, auto-detected key findings out: ecosystem dominance, licence profile, coverage warnings."
  - num: "09"
    t: "Tolerant parsing"
    d: "Continue on malformed input with structured warnings, or use --strict to fail closed."

formats:
  - text
  - json
  - sarif
  - junit
  - markdown
  - html
  - patch
