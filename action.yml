name: SBOMlyze Diff
description: Compare an SBOM with a git, release, workflow-artifact, URL, or file baseline and gate CI.
author: rezmoss

inputs:
  sbom-path:
    description: Repository-relative path to the head SBOM.
    required: true
  base-sbom-path:
    description: Optional repository-relative path to the SBOM in the baseline revision.
    required: false
  baseline:
    description: Baseline source; git, release, workflow-artifact, url, or file.
    required: false
    default: git
  baseline-repository:
    description: OWNER/REPO used by release or workflow-artifact; defaults to the current repository.
    required: false
  baseline-asset:
    description: Exact asset name in the latest GitHub release when baseline is release.
    required: false
  baseline-artifact:
    description: Exact artifact name from a successful default-branch run when baseline is workflow-artifact.
    required: false
  baseline-artifact-path:
    description: Exact SBOM path inside the workflow artifact; defaults to base-sbom-path or sbom-path.
    required: false
  baseline-url:
    description: Public HTTPS SBOM URL when baseline is url. Credentials are not forwarded.
    required: false
  baseline-path:
    description: Repository-relative workspace path when baseline is file.
    required: false
  policy:
    description: Optional repository-relative SBOMlyze policy file.
    required: false
  comment:
    description: Create or update one pull-request comment. Requires pull-requests write permission.
    required: false
    default: 'false'
  github-token:
    description: Token for provenance, comments, release assets, and workflow artifacts.
    required: false
    default: ${{ github.token }}
  sarif:
    description: Generate a SARIF report for a later upload-sarif step.
    required: false
    default: 'false'
  fail-on:
    description: Failure condition; one of policy, integrity-drift, any-change, or never.
    required: false
    default: policy
  version:
    description: Exact SBOMlyze release to download.
    required: false
    default: v0.5.2 # x-release-please-version

outputs:
  verdict:
    description: pass or fail according to fail-on.
  added-count:
    description: Number of added components.
  removed-count:
    description: Number of removed components.
  changed-count:
    description: Number of changed components.
  integrity-drift-count:
    description: Number of integrity-drift changes.
  report-json:
    description: Absolute path to the JSON report.
  report-markdown:
    description: Absolute path to the Markdown report.
  report-sarif:
    description: Absolute path to the SARIF report, or empty when sarif is false.

runs:
  using: node24
  main: action/index.js

branding:
  icon: shield
  color: blue
